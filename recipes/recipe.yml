---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: kami-os
# description will be included in the image's metadata
description: This is a dumb idea.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44 # always one generation behind latest release for stability

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
        - val-byte/branding
    install:
      packages:
        - starship
        - fastfetch
        - kami-os-logos
        - ddcutil
        - gdm
        - gnome-session
        - gnome-shell
        - plymouth-theme-spinner
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - fedora-logos
        - gnome-software
        - gnome-remote-desktop
        - ibus-anthy
        - ibus-anthy-python
        - anthy-unicode
        - ibus-hangul
        - ibus-libpinyin
        - libpinyin
        - libpinyin-data
        - ibus-m17n
        - ibus-chewing
        - libchewing
        - ibus-mozc
        - mozc
        - ibus-unikey
        - kasumi-common
        - kasumi-unicode
        - orca
        - brltty
        - nfs-utils
        - nfs-client-utils
        - nfsv3-client-utils
        - nfsv4-client-utils
        - nfs-common-utils
        - rpcbind
        - gvfs-nfs
        - fprintd
        - fprintd-pam
        - libfprint
        - hyperv-daemons
        - hypervfcopyd
        - hypervkvpd
        - hypervvssd
        - hyperv-daemons-license
        - rygel
        - ModemManager
        - ModemManager-glib
        - NetworkManager-wwan
        - mobile-broadband-provider-info
        - opensc
        - opensc-libs
      
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y install oras tar && \
            mkdir -p /tmp/ogc-rpms && \
            oras pull ghcr.io/opengamingcollective/kernel-packages-fedora:latest-fc44 -o /tmp/ogc-rpms && \
            dnf5 -y install $(find /tmp/ogc-rpms -name "kernel-*.rpm") --allow-downgrade --allowerasing && \
            rm -rf /tmp/ogc-rpms
            
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: user
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
           - page.tesk.Refine
           - org.gnome.Loupe
           - org.vinegarhq.Sober
           - org.pulseaudio.pavucontrol
           - org.gnome.Extensions
           - com.mattjakeman.ExtensionManager
           - io.github.pwr_solaar.solaar
           - app.zen_browser.zen
           - io.github.kolunmi.Bazaar
           - org.equicord.equibop
        remove:
           - org.gnome.eog
   
  - type: gnome-extensions
    install:
      - AppIndicator and KStatusNotifierItem Support
      - Just Perfection
      - Dash to Dock
      - Brightness control using ddcutil
    
  - type: bling
    install:
      - rpmfusion

  - type: script
    scripts:
      - installsevi.sh
      - starship.sh
      
  - type: os-release
    properties:
      ID: kami_os
      NAME: Kami-OS
      PRETTY_NAME: Kami-OS

  - type: initramfs
  
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
