---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: kami-os
# description will be included in the image's metadata
description: This is a dumb idea.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 43 # always one generation behind latest release for stability

stages:
  - name: ogc-kernel-stage
    from: ghcr.io/ublue/akmods:ogc-{image-version}
    modules: []

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
        - val-byte/branding
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - legcord
        - starship
        - gnome-tweaks
        - fastfetch
        - kami-os-logos
        - tailscale
        - ddcutil
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - fedora-logos

  - type: containerfile
    snippets:
      - |
        RUN --mount=type=bind,from=ogc-kernel-stage,src=/rpms,dst=/tmp/ogc-rpms \
            dnf5 -y replace /tmp/ogc-rpms/*.rpm --allow-downgrade --allowerasing
            
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
           - org.gnome.Loupe
           - org.vinegarhq.Sober
           - org.pulseaudio.pavucontrol
           - org.gnome.Extensions
           - com.mattjakeman.ExtensionManager
           - io.github.pwr_solaar.solaar
           - app.zen_browser.zen
        remove:
           - org.gnome.eog
   
  - type: gnome-extensions
    install:
      - AppIndicator and KStatusNotifierItem Support
      - Just Perfection
      - Dash to Dock
      - Control monitor brightness and volume with ddcutil
    
  - type: bling
    install:
      - rpmfusion
      
  - type: os-release
    properties:
      ID: kami_os
      NAME: Kami-OS
      PRETTY_NAME: Kami-OS
      
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
